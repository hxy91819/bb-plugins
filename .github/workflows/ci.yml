name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: plugins/*/package-lock.json
      - run: node scripts/fetch-runtime.mjs "$RUNNER_TEMP/bb-plugins-runtime"
      - id: install
        run: node scripts/verify.mjs ci
      - run: for script in scripts/*.mjs; do node --check "$script"; done
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/runtime-toolchain.mjs npm run lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/runtime-toolchain.mjs npm run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/runtime-toolchain.mjs npm test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: build
        run: node scripts/runtime-toolchain.mjs npm run build
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/runtime-toolchain.mjs npm run test:migration
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/runtime-toolchain.mjs npm run format:check
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/verify.mjs audit
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ github.token }}
