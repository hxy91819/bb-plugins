name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: |
            plugins/*/package-lock.json
            tools/*/package-lock.json
      - run: npm ci --prefix tools/agy-launch --ignore-scripts
      - run: node --check tools/agy-launch/agy-entry.mjs
      - run: npm audit --prefix tools/agy-launch
      - run: node scripts/fetch-runtime.mjs "$RUNNER_TEMP/bb-plugins-runtime"
      - name: Install unpatched DSH for native ACP regression
        run: |
          node scripts/runtime-toolchain.mjs npm install --prefix "$RUNNER_TEMP/dsh-native" --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.1
          test -x "$RUNNER_TEMP/dsh-native/node_modules/.bin/dsh"
          echo "DSH_STEERING_TEST_COMMAND=$RUNNER_TEMP/dsh-native/node_modules/.bin/dsh" >> "$GITHUB_ENV"
      - id: install
        run: node scripts/verify.mjs ci
      - run: for script in scripts/*.mjs; do node --check "$script"; done
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/runtime-toolchain.mjs npm run lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/runtime-toolchain.mjs npm run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        name: Install provider profile browser test engines
        working-directory: plugins/acp-profile-icons
        run: npx playwright install --with-deps chromium webkit
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/runtime-toolchain.mjs npm test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: build
        run: node scripts/runtime-toolchain.mjs npm run build
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/runtime-toolchain.mjs npm run test:migration
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/runtime-toolchain.mjs npm run format:check
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/verify.mjs audit
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ github.token }}
