name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Optional compatible hxy91819/bb source commit for core regression checks
        required: false
        type: string
permissions:
  contents: read
jobs:
  core:
    if: github.event_name == 'workflow_dispatch' && inputs.core_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [test, typecheck]
    name: core-${{ matrix.task }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hxy91819/bb
          ref: ${{ inputs.core_ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run ${{ matrix.task }} --continue --concurrency=2 --filter=@bb/provider-bridge-acp --filter=@bb/provider-bridge-protocol --filter=@bb/agent-runtime --filter=@bb/host-daemon-contract --filter=@get-bb/plugin-sdk --filter=@bb/server --filter=@bb/app --filter=bb-plugin-provider-codex --filter=bb-plugin-thread-list --filter=bb-plugin-account-pool --output-logs=full
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: plugins/*/package-lock.json
      - run: node scripts/fetch-runtime.mjs "$RUNNER_TEMP/bb-plugins-runtime"
      - id: install
        run: node scripts/verify.mjs ci
      - run: for script in scripts/*.mjs; do node --check "$script"; done
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: build
        run: npm run build
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:migration
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/verify.mjs audit
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ github.token }}
